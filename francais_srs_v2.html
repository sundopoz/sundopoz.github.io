<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Français SRS v2 · Conjugaison Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #EFEBE0; --paper: #FDFBF5; --ink: #14161B; --ink-2: #4A4E57; --ink-3: #8A8E96;
  --line: #DAD3C0; --line-2: #C8BFA8;
  --fem: #A03858; --masc: #2E5C8A;
  --again: #C4453D; --hard: #C68A3A; --good: #4E8A63; --easy: #3A5FA0;
  --warn: #B84545;
}
html, body {
  background: var(--bg); color: var(--ink);
  font-family: 'Inter', 'IBM Plex Sans Thai', system-ui, sans-serif;
  font-size: 16px; line-height: 1.4; min-height: 100vh;
  overscroll-behavior: none; -webkit-font-smoothing: antialiased;
}
.app { max-width: 780px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.brand { font-family: 'Fraunces', serif; font-weight: 900; font-size: 22px; letter-spacing: -0.02em; font-style: italic; }
.brand::after { content: '·'; color: var(--ink-3); margin: 0 6px; }
.brand span { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 500; font-style: normal; font-size: 13px; color: var(--ink-2); letter-spacing: 0; }
.session-clock { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); text-align: right; }

.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 16px; }
.stat { background: var(--paper); padding: 8px 4px; text-align: center; }
.stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); margin-bottom: 3px; }
.stat-value { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; line-height: 1; }
.stat-value.due { color: var(--again); }
.stat-value.new { color: var(--easy); }
.stat-value.learn { color: var(--hard); }
.stat-value.done { color: var(--good); }

.card-area { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 380px; margin-bottom: 16px; }
.card { background: var(--paper); border: 1px solid var(--line); padding: 24px 20px; min-height: 320px; display: flex; flex-direction: column; cursor: pointer; position: relative; transition: border-color 0.15s; }
.card:hover { border-color: var(--line-2); }
.card-tag { position: absolute; top: 10px; left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.card-stage { position: absolute; top: 10px; right: 12px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.05em; color: var(--ink-3); }
.card-stage.warn { color: var(--warn); }
.card-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 20px 0; }
.prompt-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.prompt { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 500; text-align: center; line-height: 1.1; letter-spacing: -0.02em; }
.prompt.small { font-size: 30px; }
.prompt.smaller { font-size: 22px; }
.prompt.th { font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 500; }
.prompt.fr { font-style: italic; }
.prompt .subject { color: var(--masc); font-weight: 600; font-style: normal; }
.prompt .verb { color: var(--ink); }
.prompt .conjugator { color: var(--ink-3); font-family: 'JetBrains Mono', monospace; font-size: 0.55em; letter-spacing: 0.1em; text-transform: uppercase; font-style: normal; margin: 0 8px; vertical-align: middle; }
.hint { font-size: 12px; color: var(--ink-3); font-style: italic; text-align: center; max-width: 360px; }
.answer { border-top: 1px dashed var(--line-2); padding-top: 18px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.answer-main { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; text-align: center; line-height: 1.15; }
.answer-main.small { font-size: 24px; }
.answer-main.mono { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 500; }
.gender-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; padding: 3px 8px; color: var(--paper); text-transform: uppercase; }
.gender-tag.fem { background: var(--fem); }
.gender-tag.masc { background: var(--masc); }
.note { font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 12px; color: var(--ink-2); text-align: center; max-width: 420px; line-height: 1.5; padding: 0 8px; }
.note strong { color: var(--warn); font-weight: 600; }
.tap-hint { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: auto; padding-top: 14px; }

.ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.rate-btn { background: var(--paper); border: 1px solid var(--line); border-top-width: 3px; padding: 10px 4px 8px; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.1s, transform 0.05s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.rate-btn:active { transform: translateY(1px); }
.rate-btn:hover { background: #F8F5EA; }
.rate-btn.again { border-top-color: var(--again); }
.rate-btn.hard { border-top-color: var(--hard); }
.rate-btn.good { border-top-color: var(--good); }
.rate-btn.easy { border-top-color: var(--easy); }
.rate-btn.disabled { opacity: 0.3; pointer-events: none; }
.rate-key { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); }
.rate-label { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.rate-interval { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-2); }

.controls { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.chip { background: transparent; border: 1px solid var(--line); color: var(--ink-2); padding: 5px 10px; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; font-size: 11px; font-weight: 500; cursor: pointer; letter-spacing: 0.02em; }
.chip:hover { background: var(--paper); color: var(--ink); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.chip .count { font-family: 'JetBrains Mono', monospace; font-size: 9px; opacity: 0.6; margin-left: 4px; }

.empty { text-align: center; padding: 60px 20px; }
.empty h2 { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 12px; font-style: italic; }
.empty p { font-family: 'IBM Plex Sans Thai', sans-serif; color: var(--ink-2); font-size: 14px; margin-bottom: 16px; line-height: 1.6; }
.empty-time { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--again); margin-bottom: 24px; }
.big-btn { background: var(--ink); color: var(--paper); border: none; padding: 12px 28px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.02em; }
.big-btn:hover { background: var(--ink-2); }
.save-indicator { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--good); opacity: 0; transition: opacity 0.3s; }
.save-indicator.show { opacity: 1; }

@media (max-width: 520px) {
  .app { padding: 10px; }
  .prompt { font-size: 30px; }
  .prompt.small { font-size: 22px; }
  .prompt.smaller { font-size: 17px; }
  .answer-main { font-size: 24px; }
  .answer-main.small { font-size: 18px; }
  .answer-main.mono { font-size: 20px; }
  .card { padding: 20px 14px; min-height: 300px; }
  .card-area { min-height: 340px; }
  .rate-label { font-size: 12px; }
  .rate-interval { font-size: 9px; }
  .brand { font-size: 17px; }
  .brand span { font-size: 11px; }
  .stat-value { font-size: 15px; }
  .stat-label { font-size: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">Français SRS<span>v2 · SM-2 algorithm</span></div>
    <div>
      <div class="session-clock" id="clock">--:--</div>
      <div class="save-indicator" id="save-ind">saved</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-label">Due</div><div class="stat-value due" id="s-due">0</div></div>
    <div class="stat"><div class="stat-label">New</div><div class="stat-value new" id="s-new">0</div></div>
    <div class="stat"><div class="stat-label">Learn</div><div class="stat-value learn" id="s-learn">0</div></div>
    <div class="stat"><div class="stat-label">Review</div><div class="stat-value done" id="s-done">0</div></div>
    <div class="stat"><div class="stat-label">Acc</div><div class="stat-value" id="s-acc">—</div></div>
  </div>

  <div class="card-area" id="card-area"></div>

  <div class="ratings" id="ratings" style="display:none">
    <button class="rate-btn again" data-rate="1">
      <div class="rate-key">1</div><div class="rate-label">ลืม</div><div class="rate-interval" id="int-1">20s</div>
    </button>
    <button class="rate-btn hard" data-rate="2">
      <div class="rate-key">2</div><div class="rate-label">ยาก</div><div class="rate-interval" id="int-2">1m</div>
    </button>
    <button class="rate-btn good" data-rate="3">
      <div class="rate-key">3</div><div class="rate-label">ได้</div><div class="rate-interval" id="int-3">5m</div>
    </button>
    <button class="rate-btn easy" data-rate="4">
      <div class="rate-key">4</div><div class="rate-label">ง่าย</div><div class="rate-interval" id="int-4">10m</div>
    </button>
  </div>

  <div class="controls">
    <button class="chip active" data-cat="all">ทั้งหมด<span class="count" id="ct-all"></span></button>
    <button class="chip" data-cat="fruit">ผลไม้<span class="count" id="ct-fruit"></span></button>
    <button class="chip" data-cat="futur_end">Endings<span class="count" id="ct-futur_end"></span></button>
    <button class="chip" data-cat="fs_irr">FS·Irregular<span class="count" id="ct-fs_irr"></span></button>
    <button class="chip" data-cat="fs_reg">FS·Regular<span class="count" id="ct-fs_reg"></span></button>
    <button class="chip" data-cat="fs_refl">FS·Reflexive<span class="count" id="ct-fs_refl"></span></button>
    <button class="chip" data-cat="fp">F.Proche<span class="count" id="ct-fp"></span></button>
    <button class="chip" data-cat="rule">กฎ/เวลา<span class="count" id="ct-rule"></span></button>
    <div style="flex:1"></div>
    <button class="chip warn" id="reset-btn">Reset</button>
  </div>
</div>

<script>
'use strict';

// ============ CARD DECK BUILDER ============
const DECK = [];

// --- FRUITS (production + recognition) ---
const FRUITS = [
  ['banane', 'f', 'กล้วย'], ['melon', 'm', 'เมลอน'], ['pomme', 'f', 'แอปเปิล'],
  ['fraise', 'f', 'สตรอว์เบอร์รี'], ['citron', 'm', 'เลม่อน'], ['pêche', 'f', 'พีช/ท้อ'],
  ['orange', 'f', 'ส้ม'], ['poire', 'f', 'แพร์/สาลี่'], ['framboise', 'f', 'ราสเบอร์รี'],
  ['raisin', 'm', 'องุ่น'], ['ananas', 'm', 'สับปะรด'], ['pamplemousse', 'm', 'เกรปฟรุต'],
  ['kiwi', 'm', 'กีวี'], ['abricot', 'm', 'แอปริคอต'], ['myrtille', 'f', 'บลูเบอร์รี'],
  ['cerise', 'f', 'เชอร์รี'],
];
FRUITS.forEach(([word, g, th], i) => {
  const num = String(i+1).padStart(2,'0');
  const article = g === 'f' ? 'une' : 'un';
  // TH → FR (production)
  DECK.push({
    id: `f${num}p`, cat: 'fruit', front: th, frontLang: 'th',
    back: `${article} ${word}`, gender: g,
    warn: word === 'fraise' ? '⚠' : null,
    note: word === 'fraise' ? 'ระวัง! <strong>une</strong> fraise (ไม่ใช่ un fraise)' : null,
  });
  // FR → TH (recognition, sparser)
  if (['banane', 'pamplemousse', 'myrtille', 'framboise', 'abricot', 'pêche', 'poire', 'ananas'].includes(word)) {
    DECK.push({
      id: `f${num}r`, cat: 'fruit', front: `${article} ${word}`, frontLang: 'fr',
      back: th, hint: 'meaning',
    });
  }
});

// --- FUTUR SIMPLE ENDINGS ---
[
  ['je', '-ai', 'ออกเสียง /e/ · คล้าย avoir présent'],
  ['tu', '-as', null],
  ['il / elle / on', '-a', null],
  ['nous', '-ons', null],
  ['vous', '-ez', null],
  ['ils / elles', '-ont', null],
].forEach(([subj, end, note], i) => {
  DECK.push({
    id: `e${i+1}`, cat: 'futur_end', front: subj, frontLang: 'fr',
    back: end, kind: 'ending', note: note,
  });
});

// --- FUTUR SIMPLE: IRREGULAR (10 verbs × 6 subjects = 60 cards) ---
const IRR_VERBS = [
  { verb: 'être', stem: 'ser', note: 'ราก: <strong>ser-</strong>' },
  { verb: 'avoir', stem: 'aur', note: 'ราก: <strong>aur-</strong>' },
  { verb: 'aller', stem: 'ir', note: 'ราก: <strong>ir-</strong> (แค่ 2 ตัว!)' },
  { verb: 'faire', stem: 'fer', note: 'ราก: <strong>fer-</strong>' },
  { verb: 'pouvoir', stem: 'pourr', note: 'ราก: <strong>pourr-</strong> (2 r!)' },
  { verb: 'vouloir', stem: 'voudr', note: 'ราก: <strong>voudr-</strong>' },
  { verb: 'devoir', stem: 'devr', note: 'ราก: <strong>devr-</strong>' },
  { verb: 'savoir', stem: 'saur', note: 'ราก: <strong>saur-</strong>' },
  { verb: 'voir', stem: 'verr', note: 'ราก: <strong>verr-</strong> (2 r!) · อย่าสับสนกับ venir' },
  { verb: 'venir', stem: 'viendr', note: 'ราก: <strong>viendr-</strong> · อย่าสับสนกับ voir' },
];
const SUBJECTS = [
  { key: 'je', label: 'je', ending: 'ai' },
  { key: 'tu', label: 'tu', ending: 'as' },
  { key: 'il', label: 'il', ending: 'a' },
  { key: 'nous', label: 'nous', ending: 'ons' },
  { key: 'vous', label: 'vous', ending: 'ez' },
  { key: 'ils', label: 'ils', ending: 'ont' },
];
const VOWELS = 'aeiouéèêâî';
function buildForm(subjKey, stem, ending) {
  const form = stem + ending;
  if (subjKey === 'je' && VOWELS.includes(form[0])) return `j'${form}`;
  const pron = subjKey; // je, tu, il, nous, vous, ils
  return `${pron} ${form}`;
}
IRR_VERBS.forEach(({verb, stem, note}) => {
  SUBJECTS.forEach(({key, label, ending}) => {
    DECK.push({
      id: `fsi_${verb}_${key}`, cat: 'fs_irr',
      front: `${verb} <span class="conjugator">·</span> ${label}`, frontLang: 'fr',
      back: buildForm(key, stem, ending), kind: 'conjug', note: note,
    });
  });
});

// --- FUTUR SIMPLE: REGULAR ---
// Pattern verbs (full grid × 6)
const REG_PATTERNS = [
  { verb: 'parler', stem: 'parler', note: '<strong>-ER</strong>: infinitif เต็ม + หาง' },
  { verb: 'finir', stem: 'finir', note: '<strong>-IR</strong>: infinitif เต็ม + หาง' },
  { verb: 'boire', stem: 'boir', note: '<strong>-RE</strong>: ตัด e ทิ้ง แล้วเติมหาง' },
];
REG_PATTERNS.forEach(({verb, stem, note}) => {
  SUBJECTS.forEach(({key, label, ending}) => {
    DECK.push({
      id: `fsr_${verb}_${key}`, cat: 'fs_reg',
      front: `${verb} <span class="conjugator">·</span> ${label}`, frontLang: 'fr',
      back: buildForm(key, stem, ending), kind: 'conjug', note: note,
    });
  });
});
// Extra regular verbs (scattered subjects for variety)
const REG_EXTRA = [
  { verb: 'écrire', stem: 'écrir', group: 're', subjs: ['tu', 'je', 'nous', 'ils'], note: '-RE ตัด e' },
  { verb: 'prendre', stem: 'prendr', group: 're', subjs: ['il', 'je', 'nous', 'vous'], note: '-RE ตัด e' },
  { verb: 'sortir', stem: 'sortir', group: 'ir', subjs: ['il', 'ils', 'je'], note: '-IR ปกติ' },
  { verb: 'choisir', stem: 'choisir', group: 'ir', subjs: ['nous', 'tu', 'ils'], note: '-IR ปกติ' },
  { verb: 'discuter', stem: 'discuter', group: 'er', subjs: ['nous', 'tu', 'ils'], note: '-ER ปกติ' },
  { verb: 'ranger', stem: 'ranger', group: 'er', subjs: ['ils', 'on'], note: '-ER ปกติ' },
  { verb: 'manger', stem: 'manger', group: 'er', subjs: ['je', 'vous', 'il'], note: '-ER ปกติ' },
];
REG_EXTRA.forEach(({verb, stem, group, subjs, note}) => {
  subjs.forEach(subjKey => {
    let ending, label;
    if (subjKey === 'on') { ending = 'a'; label = 'on'; }
    else { const s = SUBJECTS.find(x => x.key === subjKey); ending = s.ending; label = s.label; }
    let back;
    if (subjKey === 'on') back = `on ${stem}${ending}`;
    else back = buildForm(subjKey, stem, ending);
    DECK.push({
      id: `fsr_${verb}_${subjKey}`, cat: 'fs_reg',
      front: `${verb} <span class="conjugator">·</span> ${label}`, frontLang: 'fr',
      back: back, kind: 'conjug', note: note,
    });
  });
});

// --- FUTUR SIMPLE: REFLEXIVE ---
const REFLEXIVE = [
  { verb: "s'entendre", subj: 'vous', back: 'vous vous entendrez', note: '-RE ตัด e · <strong>vous vous</strong> (คู่)' },
  { verb: "s'entendre", subj: 'nous', back: 'nous nous entendrons', note: '<strong>nous nous</strong>' },
  { verb: "s'entendre", subj: 'ils', back: "ils s'entendront", note: "ils → <strong>s'</strong>" },
  { verb: "s'en sortir", subj: 'on', back: "on s'en sortira", note: '-IR ปกติ · <strong>s\'en</strong>' },
  { verb: "s'en sortir", subj: 'je', back: "je m'en sortirai", note: 'je → <strong>m\'en</strong>' },
  { verb: "s'en sortir", subj: 'tu', back: "tu t'en sortiras", note: 'tu → <strong>t\'en</strong>' },
];
REFLEXIVE.forEach(({verb, subj, back, note}, i) => {
  DECK.push({
    id: `fref_${i}`, cat: 'fs_refl',
    front: `${verb} <span class="conjugator">·</span> ${subj}`, frontLang: 'fr',
    back: back, kind: 'conjug', note: note,
  });
});

// --- FUTUR PROCHE (aller + infinitive) ---
// Basic aller drill (6)
SUBJECTS.forEach(({key, label}) => {
  const aller = {je:'vais', tu:'vas', il:'va', nous:'allons', vous:'allez', ils:'vont'}[key];
  DECK.push({
    id: `fpa_${key}`, cat: 'fp',
    front: `${label} <span class="conjugator">+ aller</span>`, frontLang: 'fr',
    back: aller, kind: 'conjug',
    note: 'Futur proche = aller (présent) + infinitif · verb ตัวหลัก<strong>ไม่เปลี่ยน</strong>',
  });
});
// Subject × infinitive combos (24)
const FP_COMBOS = [
  ['je', 'manger'], ['je', 'lire'], ['je', 'partir'], ['je', 'voir'],
  ['tu', 'travailler'], ['tu', 'sortir'], ['tu', 'venir'], ['tu', 'boire'],
  ['il', 'voir'], ['il', 'faire'], ['il', 'prendre'], ['il', 'dormir'],
  ['elle', 'voyager'], ['elle', 'parler'], ['elle', 'écrire'], ['elle', 'comprendre'],
  ['nous', 'rentrer'], ['nous', 'aller'], ['nous', 'boire'], ['nous', 'finir'],
  ['vous', 'lire'], ['vous', 'nettoyer'], ['vous', 'comprendre'], ['vous', 'choisir'],
  ['ils', 'acheter'], ['ils', 'terminer'], ['ils', 'écrire'], ['ils', 'partir'],
];
const ALLER_MAP = {je:'vais', tu:'vas', il:'va', elle:'va', on:'va', nous:'allons', vous:'allez', ils:'vont', elles:'vont'};
FP_COMBOS.forEach(([subj, inf]) => {
  DECK.push({
    id: `fp_${subj}_${inf}`, cat: 'fp',
    front: `${subj} <span class="conjugator">+</span> ${inf}`, frontLang: 'fr',
    back: `${subj} ${ALLER_MAP[subj]} ${inf}`, kind: 'conjug',
  });
});
// Special case from worksheet
DECK.push({
  id: 'fp_mme', cat: 'fp',
  front: `Mme Dubois <span class="conjugator">+</span> faire`, frontLang: 'fr',
  back: `Mme Dubois va faire`, kind: 'conjug',
  note: 'Mme = elle → <strong>va</strong>',
});

// --- RULES & TIME ---
const RULES = [
  ['-ER / -IR verb ทำ F.simple ยังไง?', 'th', 'infinitif เต็ม + หาง', 'rule', 'parler → je parlerai · finir → je finirai'],
  ['-RE verb ทำ F.simple ยังไง?', 'th', 'ตัด e ก่อน แล้วเติมหาง', 'rule', 'boire → je boirai · écrire → j\'écrirai · <strong>อย่าลืมตัด e!</strong>'],
  ['Futur proche สูตร?', 'th', 'aller (présent) + infinitif', 'rule', 'Je vais manger. · Ils vont partir.'],
  ['Si clause แบบที่ 1', 'th', 'Si + présent, futur simple', 'rule', '<strong>ห้าม futur ใน Si!</strong> · Si je suis libre, je te rappellerai.'],
  ['demain', 'fr', 'พรุ่งนี้', 'time', null],
  ['le mois prochain', 'fr', 'เดือนหน้า', 'time', null],
  ["l'année prochaine", 'fr', 'ปีหน้า', 'time', null],
  ['la semaine prochaine', 'fr', 'อาทิตย์หน้า', 'time', null],
  ['dans 2 semaines', 'fr', 'อีก 2 สัปดาห์', 'time', null],
  ['ce soir', 'fr', 'คืนนี้', 'time', null],
  ['bientôt', 'fr', 'เร็ว ๆ นี้', 'time', null],
  ['éplucher', 'fr', 'ปอกเปลือก', 'vocab', null],
  ['manger cuit', 'fr', 'กินสุก (cuit = สุก · cru = ดิบ)', 'vocab', null],
  ['salade de fruits', 'fr', 'สลัดผลไม้', 'vocab', 'Pour préparer <strong>une</strong> salade de fruits...'],
];
RULES.forEach(([front, lang, back, hint, note], i) => {
  DECK.push({
    id: `g${String(i+1).padStart(2,'0')}`, cat: 'rule',
    front: front, frontLang: lang, back: back, hint: hint, note: note,
  });
});

// ============ SM-2 SCHEDULER ============
const CONFIG = {
  LEARNING_STEPS: [20, 60, 300],      // 20s, 1m, 5m
  GRAD_INTERVAL: 10 * 60,             // 10min → first review
  EASY_GRAD_INTERVAL: 15 * 60,        // easy graduates to 15min
  MIN_EASE: 1.3,
  MAX_EASE: 3.0,
  DEFAULT_EASE: 2.5,
  HARD_MULT: 1.2,
  EASY_MULT: 1.3,
  MAX_INTERVAL: 4 * 3600,             // cap at 4h (for pre-exam)
};

function newCardState() {
  return {
    phase: 'new',       // new | learning | review
    stepIndex: 0,       // for learning phase
    intervalSec: 0,     // for review phase
    ease: CONFIG.DEFAULT_EASE,
    dueAt: 0,
    reps: 0,
    lapses: 0,
    lastRate: 0,
  };
}

// Return {intervalSec, newState}
function schedule(state, rating) {
  const s = JSON.parse(JSON.stringify(state));
  const now = Date.now();
  s.reps += 1;
  s.lastRate = rating;

  const inLearning = s.phase === 'new' || s.phase === 'learning';

  if (inLearning) {
    if (rating === 1) {
      s.phase = 'learning'; s.stepIndex = 0;
      s.ease = Math.max(s.ease - 0.2, CONFIG.MIN_EASE);
      s.intervalSec = CONFIG.LEARNING_STEPS[0];
    } else if (rating === 2) {
      s.phase = 'learning';
      s.intervalSec = Math.round(CONFIG.LEARNING_STEPS[s.stepIndex] * 1.5);
    } else if (rating === 3) {
      s.stepIndex += 1;
      if (s.stepIndex >= CONFIG.LEARNING_STEPS.length) {
        s.phase = 'review';
        s.intervalSec = CONFIG.GRAD_INTERVAL;
      } else {
        s.phase = 'learning';
        s.intervalSec = CONFIG.LEARNING_STEPS[s.stepIndex];
      }
    } else if (rating === 4) {
      s.phase = 'review';
      s.intervalSec = CONFIG.EASY_GRAD_INTERVAL;
      s.ease = Math.min(s.ease + 0.15, CONFIG.MAX_EASE);
    }
  } else {
    // Review phase — Anki-like
    if (rating === 1) {
      s.lapses += 1;
      s.phase = 'learning'; s.stepIndex = 0;
      s.ease = Math.max(s.ease - 0.2, CONFIG.MIN_EASE);
      s.intervalSec = CONFIG.LEARNING_STEPS[0];
    } else if (rating === 2) {
      s.ease = Math.max(s.ease - 0.15, CONFIG.MIN_EASE);
      s.intervalSec = Math.round(Math.min(s.intervalSec * CONFIG.HARD_MULT, CONFIG.MAX_INTERVAL));
    } else if (rating === 3) {
      s.intervalSec = Math.round(Math.min(s.intervalSec * s.ease, CONFIG.MAX_INTERVAL));
    } else if (rating === 4) {
      s.ease = Math.min(s.ease + 0.15, CONFIG.MAX_EASE);
      s.intervalSec = Math.round(Math.min(s.intervalSec * s.ease * CONFIG.EASY_MULT, CONFIG.MAX_INTERVAL));
    }
  }

  s.dueAt = now + s.intervalSec * 1000;
  return s;
}

// ============ STATE ============
const STORAGE_KEY = 'francais_srs_v2';
let cardState = {};
let currentFilter = 'all';
let currentCard = null;
let showingAnswer = false;
let sessionStart = Date.now();
let sessionReviews = 0;
let sessionCorrect = 0;

function initState() {
  cardState = {};
  DECK.forEach(c => { cardState[c.id] = newCardState(); });
}

function collectState() {
  return {
    cardState, sessionStart, sessionReviews, sessionCorrect,
    currentFilter, savedAt: Date.now(), version: 2,
  };
}

// ============ STORAGE (dual: localStorage + window.storage) ============
let saveTimer = null;
function saveState() {
  const json = JSON.stringify(collectState());
  try { localStorage.setItem(STORAGE_KEY, json); } catch(e) {}
  try {
    if (window.storage && window.storage.set) window.storage.set(STORAGE_KEY, json);
  } catch(e) {}
  // Show save indicator
  const ind = document.getElementById('save-ind');
  if (ind) {
    ind.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => ind.classList.remove('show'), 800);
  }
}

async function loadState() {
  let json = null;
  try { json = localStorage.getItem(STORAGE_KEY); } catch(e) {}
  if (!json) {
    try {
      if (window.storage && window.storage.get) {
        const r = await window.storage.get(STORAGE_KEY);
        json = r && r.value ? r.value : null;
      }
    } catch(e) {}
  }
  if (!json) return false;
  try {
    const data = JSON.parse(json);
    // Merge saved state into fresh scaffold (handles new cards added to deck)
    const fresh = {};
    DECK.forEach(c => { fresh[c.id] = data.cardState[c.id] || newCardState(); });
    cardState = fresh;
    sessionStart = data.sessionStart || Date.now();
    sessionReviews = data.sessionReviews || 0;
    sessionCorrect = data.sessionCorrect || 0;
    currentFilter = data.currentFilter || 'all';
    return true;
  } catch(e) { return false; }
}

// Save on any critical event
window.addEventListener('beforeunload', () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); } catch(e) {}
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveState();
});

// ============ SELECTION ============
function inFilter(c) { return currentFilter === 'all' || c.cat === currentFilter; }

function pickNext() {
  const now = Date.now();
  const due = DECK.filter(c => inFilter(c) && cardState[c.id].dueAt <= now);
  if (due.length === 0) return null;

  const lapsed = due.filter(c => cardState[c.id].lapses > 0 && cardState[c.id].phase === 'learning');
  const learning = due.filter(c => cardState[c.id].phase === 'learning' && cardState[c.id].lapses === 0 && cardState[c.id].reps > 0);
  const news = due.filter(c => cardState[c.id].phase === 'new');
  const review = due.filter(c => cardState[c.id].phase === 'review');

  const pool = [];
  lapsed.forEach(c => { pool.push(c, c, c); });
  learning.forEach(c => { pool.push(c, c); });
  news.forEach(c => { pool.push(c, c); });
  review.forEach(c => { pool.push(c); });

  if (pool.length === 0) return null;
  // Avoid immediate repeat
  const noRepeat = pool.filter(c => !currentCard || c.id !== currentCard.id);
  const chosen = (noRepeat.length > 0 ? noRepeat : pool);
  return chosen[Math.floor(Math.random() * chosen.length)];
}

// ============ RENDER ============
function fmtInterval(ms) {
  const s = Math.max(1, Math.round(ms/1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s/60) + 'm';
  return (s/3600).toFixed(s < 7200 ? 1 : 0) + 'h';
}

function updateIntervalPreview() {
  if (!currentCard) return;
  const s = cardState[currentCard.id];
  for (let r = 1; r <= 4; r++) {
    const preview = schedule(s, r);
    const ms = preview.dueAt - Date.now();
    const el = document.getElementById(`int-${r}`);
    if (el) el.textContent = fmtInterval(ms);
  }
}

function updateStats() {
  const now = Date.now();
  let due=0, news=0, learn=0, review=0;
  DECK.forEach(c => {
    if (!inFilter(c)) return;
    const s = cardState[c.id];
    if (s.dueAt <= now) due += 1;
    if (s.phase === 'new') news += 1;
    if (s.phase === 'learning' && s.reps > 0) learn += 1;
    if (s.phase === 'review') review += 1;
  });
  document.getElementById('s-due').textContent = due;
  document.getElementById('s-new').textContent = news;
  document.getElementById('s-learn').textContent = learn;
  document.getElementById('s-done').textContent = review;
  const acc = sessionReviews > 0 ? Math.round(100 * sessionCorrect / sessionReviews) + '%' : '—';
  document.getElementById('s-acc').textContent = acc;

  // Update chip counts
  const cats = ['fruit','futur_end','fs_irr','fs_reg','fs_refl','fp','rule'];
  cats.forEach(cat => {
    const el = document.getElementById(`ct-${cat}`);
    if (!el) return;
    const total = DECK.filter(c => c.cat === cat).length;
    el.textContent = ` ${total}`;
  });
  const totalAll = DECK.length;
  document.getElementById('ct-all').textContent = ` ${totalAll}`;
}

function updateClock() {
  const elapsed = Date.now() - sessionStart;
  const m = Math.floor(elapsed / 60000);
  const s = Math.floor((elapsed % 60000) / 1000);
  document.getElementById('clock').textContent =
    `session · ${m}:${String(s).padStart(2,'0')} · ${sessionReviews} rev`;
}

function nextDueTime() {
  const now = Date.now();
  let min = Infinity;
  DECK.forEach(c => {
    if (!inFilter(c)) return;
    const s = cardState[c.id];
    if (s.dueAt > now && s.dueAt < min) min = s.dueAt;
  });
  return min === Infinity ? null : min - now;
}

function renderCard() {
  const area = document.getElementById('card-area');
  const ratings = document.getElementById('ratings');

  if (!currentCard) currentCard = pickNext();

  if (!currentCard) {
    ratings.style.display = 'none';
    const nextMs = nextDueTime();
    const timeStr = nextMs !== null
      ? `<div class="empty-time">การ์ดถัดไป: ${fmtInterval(nextMs)}</div>` : '';
    area.innerHTML = `
      <div class="empty">
        <h2>bien joué</h2>
        <p>ตอนนี้ยังไม่มีการ์ดต้องรีวิว<br>พักได้ หรือกดปุ่มด้านล่างเพื่อกดต่อ</p>
        ${timeStr}
        <button class="big-btn" onclick="forceCard()">รีวิวการ์ดที่จำแล้ว</button>
      </div>`;
    updateStats();
    return;
  }

  ratings.style.display = 'grid';
  updateIntervalPreview();

  const c = currentCard;
  const s = cardState[c.id];

  // Stage indicator
  let stage = '';
  let stageClass = '';
  if (s.phase === 'new') stage = 'ใหม่';
  else if (s.phase === 'learning' && s.lapses > 0) { stage = `ลืม ×${s.lapses}`; stageClass = 'warn'; }
  else if (s.phase === 'learning') stage = `เรียน ${s.stepIndex+1}/${CONFIG.LEARNING_STEPS.length}`;
  else stage = `ทวน · ease ${s.ease.toFixed(1)}`;

  // Front
  let frontClass = 'prompt';
  const frontLen = c.front.replace(/<[^>]*>/g,'').length;
  if (frontLen > 15) frontClass += ' small';
  if (frontLen > 30) frontClass += ' smaller';
  if (c.frontLang === 'th') frontClass += ' th';
  if (c.frontLang === 'fr') frontClass += ' fr';

  let promptLabel = '';
  if (c.cat === 'fruit' && c.frontLang === 'th') promptLabel = 'FR · เขียน (พร้อม un/une)';
  else if (c.cat === 'fruit' && c.frontLang === 'fr') promptLabel = 'TH · แปล';
  else if (c.cat === 'futur_end') promptLabel = 'FUTUR SIMPLE · หางของ';
  else if (c.cat === 'fs_irr') promptLabel = 'FUTUR SIMPLE · irregular';
  else if (c.cat === 'fs_reg') promptLabel = 'FUTUR SIMPLE · regular';
  else if (c.cat === 'fs_refl') promptLabel = 'FUTUR SIMPLE · reflexive';
  else if (c.cat === 'fp') promptLabel = 'FUTUR PROCHE';
  else if (c.cat === 'rule') promptLabel = c.hint === 'time' ? 'TIME · แปล' : c.hint === 'vocab' ? 'VOCAB' : 'กฎ';

  const warnBadge = c.warn ? `<div class="card-stage warn">${c.warn} tricky</div>` : `<div class="card-stage ${stageClass}">${stage}</div>`;

  let answerHTML = '';
  if (showingAnswer) {
    const backLen = c.back.length;
    let ansClass = 'answer-main';
    if (c.kind === 'ending' || c.kind === 'conjug') ansClass += ' mono';
    if (backLen > 20) ansClass += ' small';

    if (c.cat === 'fruit' && c.frontLang === 'th' && c.gender) {
      const tagClass = c.gender === 'f' ? 'fem' : 'masc';
      const tagText = c.gender === 'f' ? 'féminin' : 'masculin';
      answerHTML = `
        <div class="answer">
          <div class="${ansClass}">${c.back}</div>
          <span class="gender-tag ${tagClass}">${tagText}</span>
          ${c.note ? `<div class="note">${c.note}</div>` : ''}
        </div>`;
    } else {
      answerHTML = `
        <div class="answer">
          <div class="${ansClass}">${c.back}</div>
          ${c.note ? `<div class="note">${c.note}</div>` : ''}
        </div>`;
    }
  }

  const tapHint = showingAnswer ? 'ให้คะแนน · 1 2 3 4' : 'แตะการ์ด / space · ดูเฉลย';

  const promptLangLabel = c.frontLang === 'th' ? 'ภาษาไทย' : 'français';

  const hintHTML = c.hint && !showingAnswer
    ? `<div class="hint">${c.hint === 'meaning' ? 'บอกความหมาย' : c.hint === 'time' ? 'คำบ่งเวลา' : c.hint === 'vocab' ? 'คำศัพท์' : ''}</div>`
    : '';

  area.innerHTML = `
    <div class="card" id="card-el">
      <div class="card-tag">${promptLabel}</div>
      ${warnBadge}
      <div class="card-content">
        <div class="prompt-label">${promptLangLabel}</div>
        <div class="${frontClass}">${c.front}</div>
        ${hintHTML}
      </div>
      ${answerHTML}
      <div class="tap-hint">${tapHint}</div>
    </div>`;

  document.getElementById('card-el').addEventListener('click', flipCard);
  document.querySelectorAll('.rate-btn').forEach(b => {
    b.classList.toggle('disabled', !showingAnswer);
  });
  updateStats();
}

function flipCard() {
  if (!currentCard || showingAnswer) return;
  showingAnswer = true;
  renderCard();
}

function rateCard(rating) {
  if (!currentCard || !showingAnswer) return;
  const oldState = cardState[currentCard.id];
  const newSt = schedule(oldState, rating);
  cardState[currentCard.id] = newSt;
  sessionReviews += 1;
  if (rating > 1) sessionCorrect += 1;
  showingAnswer = false;
  currentCard = null;
  saveState();
  renderCard();
}

function forceCard() {
  const pool = DECK.filter(inFilter);
  if (pool.length === 0) return;
  currentCard = pool[Math.floor(Math.random() * pool.length)];
  showingAnswer = false;
  renderCard();
}
window.forceCard = forceCard;

function render() { renderCard(); }

// ============ EVENTS ============
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!showingAnswer && currentCard) flipCard();
    return;
  }
  if (showingAnswer && ['1','2','3','4'].includes(e.key)) {
    e.preventDefault();
    rateCard(parseInt(e.key));
  }
});
document.querySelectorAll('.rate-btn').forEach(btn => {
  btn.addEventListener('click', () => rateCard(parseInt(btn.dataset.rate)));
});
document.querySelectorAll('.chip[data-cat]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-cat]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.cat;
    currentCard = null; showingAnswer = false;
    render(); saveState();
  });
});
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('รีเซ็ตความคืบหน้าทั้งหมด?')) return;
  initState();
  sessionStart = Date.now(); sessionReviews = 0; sessionCorrect = 0;
  currentCard = null; showingAnswer = false;
  saveState(); render();
});

// ============ INIT ============
(async () => {
  initState();
  await loadState();
  document.querySelectorAll('.chip[data-cat]').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === currentFilter);
  });
  render();
  setInterval(() => {
    updateClock();
    updateStats();
    if (!currentCard) {
      const next = pickNext();
      if (next) render();
    }
  }, 1000);
  updateClock();
})();
</script>
