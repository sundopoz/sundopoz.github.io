<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Counter App</title>
    <style>
        /* * THEME VARIABLES 
         */
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #212529;
            --text-sec: #6c757d;
            --accent: #3b82f6; /* Blue */
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --border: #e9ecef;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        [data-theme="dark"] {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f9fafb;
            --text-sec: #9ca3af;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --danger: #f87171;
            --border: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* * RESET & BASE STYLES 
         */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
            padding-bottom: 100px; /* Space for fixed bottom button */
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* * HEADER & CONTROLS 
         */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--border);
        }

        /* * COUNTER CARD 
         */
        .counter-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .counter-card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transition: transform 0.2s;
        }

        /* Card Header: Title & Delete */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-title {
            font-size: 1.1rem;
            font-weight: 600;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            border-radius: 4px;
            padding: 2px 5px;
            width: 70%;
        }

        .counter-title:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-sec);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            transition: color 0.2s;
        }

        .btn-delete:hover {
            color: var(--danger);
        }

        /* The Big Number */
        .count-display {
            font-size: 3.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--accent);
            font-variant-numeric: tabular-nums; /* Prevents jitter when numbers change */
        }

        /* Controls: - [Input] + */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-control {
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 50px;
            height: 50px;
            border-radius: 50%; /* Circle buttons */
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s active;
            user-select: none;
        }

        .btn-control:active {
            transform: scale(0.95);
            background-color: var(--border);
        }

        /* The "Whatever Number" Input */
        .step-input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step-label {
            font-size: 0.7rem;
            color: var(--text-sec);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .step-input {
            width: 60px;
            text-align: center;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-weight: 600;
            font-size: 1rem;
        }

        .step-input:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        /* * BOTTOM ADD BUTTON 
         */
        .fab-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 580px;
            z-index: 100;
        }

        .btn-add {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: var(--text-sec);
            margin-top: 50px;
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Multi Counter</h1>
            <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌙</button>
        </header>

        <div id="counterList" class="counter-list">
            </div>

        <div id="emptyState" class="empty-state">
            No counters yet. Click "Add Counter" to start.
        </div>
    </div>

    <div class="fab-container">
        <button class="btn-add" onclick="addNewCounter()">
            <span>+</span> Add New Counter
        </button>
    </div>

    <script>
        // --- DATA & STATE ---
        let counters = JSON.parse(localStorage.getItem('myCounters')) || [];

        // If fresh load with no data, create one default counter
        if (counters.length === 0) {
            counters = [{ id: Date.now(), title: 'Counter 1', count: 0, step: 1 }];
        }

        const listEl = document.getElementById('counterList');
        const emptyState = document.getElementById('emptyState');
        const themeToggle = document.getElementById('themeToggle');

        // --- THEME LOGIC ---
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // --- CORE FUNCTIONS ---

        function save() {
            localStorage.setItem('myCounters', JSON.stringify(counters));
            render();
        }

        function addNewCounter() {
            const newId = Date.now();
            counters.push({
                id: newId,
                title: `Counter ${counters.length + 1}`,
                count: 0,
                step: 1
            });
            save();
            // Scroll to bottom smoothly
            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
        }

        function removeCounter(id) {
            if(confirm('Delete this counter?')) {
                counters = counters.filter(c => c.id !== id);
                save();
            }
        }

        function updateCount(id, delta) {
            const counter = counters.find(c => c.id === id);
            if (counter) {
                counter.count += delta;
                save();
            }
        }

        function updateStep(id, val) {
            const counter = counters.find(c => c.id === id);
            if (counter) {
                counter.step = Number(val);
                // We don't call save() here on every keystroke to avoid UI jitter, 
                // but we save on blur (handled in HTML event)
                localStorage.setItem('myCounters', JSON.stringify(counters));
            }
        }

        function updateTitle(id, val) {
            const counter = counters.find(c => c.id === id);
            if (counter) {
                counter.title = val;
                localStorage.setItem('myCounters', JSON.stringify(counters));
            }
        }

        // --- RENDER ---
        function render() {
            listEl.innerHTML = '';
            
            if (counters.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            counters.forEach(c => {
                const div = document.createElement('div');
                div.className = 'counter-card';
                div.innerHTML = `
                    <div class="card-header">
                        <input 
                            type="text" 
                            class="counter-title" 
                            value="${c.title}" 
                            onchange="updateTitle(${c.id}, this.value)"
                            aria-label="Counter Name"
                        >
                        <button class="btn-delete" onclick="removeCounter(${c.id})" title="Delete">🗑️</button>
                    </div>

                    <div class="count-display">${c.count}</div>

                    <div class="controls">
                        <button class="btn-control" onclick="updateCount(${c.id}, -${c.step})">−</button>
                        
                        <div class="step-input-wrapper">
                            <label class="step-label">Step</label>
                            <input 
                                type="number" 
                                class="step-input" 
                                value="${c.step}" 
                                onchange="updateStep(${c.id}, this.value)"
                                title="Change the number added/subtracted"
                            >
                        </div>

                        <button class="btn-control" onclick="updateCount(${c.id}, ${c.step})">+</button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        // Initial Render
        render();

    </script>
</body>
</html>
