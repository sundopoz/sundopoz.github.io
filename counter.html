<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Counter App</title>
    <link rel="stylesheet" href="style/counter.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>Multi Counter</h1>
            <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌙</button>
        </header>

        <div id="counterList" class="counter-list">
        </div>

        <div id="emptyState" class="empty-state">
            No counters yet. Click "Add Counter" to start.
        </div>
    </div>

    <div class="fab-container">
        <button class="btn-add" onclick="addNewCounter()">
            <span>+</span> Add New Counter
        </button>
    </div>

    <script src="script/counter.js"></script>
</body>

</html>
