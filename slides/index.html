<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สไลด์นำเสนอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dark:#0f1f24;--teal:#2FC4B8;--mint:#9FF0E6;--cream:#F2F7F6;--muted:#BCD3D0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--dark);color:var(--cream);font-family:'IBM Plex Sans Thai','Sarabun',Tahoma,sans-serif;letter-spacing:0;line-height:1.6;
 background-image:radial-gradient(circle at 12% -10%,rgba(47,196,184,.28),rgba(47,196,184,0) 55%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 120px)}
main{max-width:1100px;margin:0 auto;padding:72px 24px 64px}
h1{font-family:'Prompt',Tahoma,sans-serif;font-weight:600;font-size:clamp(30px,5vw,48px);line-height:1.3}
.sub{color:var(--muted);font-size:18px;margin-top:6px;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.85)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:28px;margin-top:44px}
a.card{display:block;text-decoration:none;color:inherit;padding:34px 36px 30px;border-radius:14px;
 background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 55%,rgba(255,255,255,.11));
 border:1.5px solid rgba(255,255,255,.30);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 30px 60px rgba(0,0,0,.35);transition:transform .25s ease,border-color .25s ease}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--teal);outline:none}
.no{font-size:18px;font-weight:500;color:var(--teal)}
.card h2{font-family:'Prompt',Tahoma,sans-serif;font-weight:600;font-size:36px;line-height:1.3;margin-top:4px}
.en{font-family:'Prompt',Tahoma,sans-serif;font-style:italic;font-weight:500;font-size:22px;color:var(--teal);margin-top:2px}
.meta{margin-top:18px;font-size:18px;color:var(--muted)}
.go{display:inline-block;margin-top:24px;padding:4px 22px;border:2px solid var(--teal);border-radius:10px;font-size:20px;font-weight:500;color:var(--teal)}
a.card:hover .go,a.card:focus-visible .go{background:rgba(47,196,184,.14)}
.help{margin-top:40px;color:var(--muted);font-size:17px}
</style>
</head>
<body>
<main>
 <h1>สไลด์นำเสนอ</h1>
 <p class="sub">เลือกเรื่องที่ต้องการเปิด</p>
 <div class="grid">
  <a class="card" href="paragonimiasis/">
   <div class="no">เรื่องที่ 1</div>
   <h2>โรคพยาธิใบไม้ในปอด</h2><div class="en">Paragonimiasis</div>
   <p class="meta">26 สไลด์</p>
   <span class="go">เปิดสไลด์ →</span>
  </a>
  <a class="card" href="pneumothorax/">
   <div class="no">เรื่องที่ 2</div>
   <h2>ภาวะปอดรั่ว</h2><div class="en">Pneumothorax</div>
   <p class="meta">16 สไลด์ · รวมทบทวนวรรณกรรมและเอกสารอ้างอิง</p>
   <span class="go">เปิดสไลด์ →</span>
  </a>
 </div>
 <p class="help">ในสไลด์: ใช้ลูกศร ← → หรือคลิกเพื่อเปลี่ยนสไลด์</p>
</main>
</body>
</html>
